<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alexandria:Coding Agent</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="panel-shell">
      <header class="panel-header">
        <div>
          <p class="eyebrow">Coding agent</p>
          <h1>Alexandria</h1>
        </div>
        <button id="open-options" class="icon-button" type="button" aria-label="Open settings" title="Open settings">Settings</button>
      </header>

      <section class="context-card" aria-labelledby="context-title">
        <div class="context-heading">
          <p id="context-title" class="section-label">Current context</p>
          <button id="refresh-context" class="link-button" type="button">Refresh</button>
        </div>
        <p id="context-summary">Checking the active coding page…</p>
        <p id="provider-status" class="provider-status">Checking provider configuration…</p>
      </section>

      <section id="conversation" class="conversation" aria-live="polite" aria-label="Agent conversation">
        <article class="message assistant-message welcome-message">
          <p class="message-role">Alexandria</p>
          <p>Ask Alexandria to inspect the current page, explain a selected block, draft a change, or prepare a GitHub workflow. Page changes are always proposed for your approval first.</p>
        </article>
      </section>

      <section id="proposals" class="proposals" aria-label="Proposed page edits" hidden></section>

      <form id="agent-form" class="composer">
        <label for="agent-prompt">Message Alexandria</label>
        <textarea id="agent-prompt" name="agent-prompt" rows="4" placeholder="Explain this repository, refactor the selected code, or prepare a pull-request description…"></textarea>
        <div class="composer-actions">
          <span id="run-status" class="run-status" role="status"></span>
          <button id="send-button" type="submit" class="primary-button">Send</button>
        </div>
      </form>
    </main>
    <script type="module" src="panel.js"></script>
  </body>
</html>
